
services:
  api:
    build: .
    container_name: nixar_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      # Agent veritabanları aynı ağ üzerinde otomatik bulunacak
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nixar_network

  db:
    image: postgres:13
    container_name: nixar_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nixar_network

volumes:
  pg_data:

networks:
  nixar_network:
    driver: bridge
